{% load i18n %}
{% autoescape off %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        .button {
            background-color: #5865F2;
            color: white;
            padding: 10px 20px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            margin: 10px 0;
            border-radius: 5px;
        }
        .button:hover {
            background-color: #404eed;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <p>Hey {{ user.first_name }} {{ user.last_name|default:user.username }},</p>
    <p>Your University Library password can be reset by clicking the button below. If you did not request a new password, please ignore this email.</p>
    <a href="http://127.0.0.1:3000/reset-password?uid={{ uid }}&token={{ token }}" class="button">Reset Password</a>
    <hr>
</body>
</html>
{% endautoescape %}
